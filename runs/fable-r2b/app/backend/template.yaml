AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Chaos Commerce backend: one Lambda function behind an HTTP API. It serves the
  storefront's /api/* calls and runs checkout and returns as workflows on the
  Conductor server named in ConductorServerUrl.

Parameters:
  ConductorServerUrl:
    Type: String
    AllowedPattern: "^https?://.+"
    Description: >-
      Conductor API base URL, e.g. https://conductor.example.com/api. It must be
      reachable from Lambda (a localhost address is not).
  AllowedOrigins:
    Type: String
    Default: "*"
    Description: >-
      Comma-separated origins allowed to call the API, e.g.
      https://your-name.github.io. "*" allows any origin.
  ConductorUiUrl:
    Type: String
    Default: ""
    Description: Optional. Conductor UI base URL; adds "see the workflow" links to receipts and decisions.
  ConductorAuthKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional. Access key id, for Conductor servers that require authentication (Orkes).
  ConductorAuthSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional. Access key secret that goes with ConductorAuthKey.
  OathWindowSeconds:
    Type: Number
    Default: 60
    MinValue: 5
    MaxValue: 600
    Description: How long a return waits for the customer's Returns Oath before deciding without it.

Resources:
  StoreApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: Chaos Commerce storefront API
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  StoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Chaos Commerce API (catalogue, checkout, returns)
      CodeUri: .
      Handler: src/lambda.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 29
      Environment:
        Variables:
          CONDUCTOR_SERVER_URL: !Ref ConductorServerUrl
          CONDUCTOR_UI_URL: !Ref ConductorUiUrl
          CONDUCTOR_AUTH_KEY: !Ref ConductorAuthKey
          CONDUCTOR_AUTH_SECRET: !Ref ConductorAuthSecret
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          OATH_WINDOW_SECONDS: !Ref OathWindowSeconds
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoreApi
            Path: /api/{proxy+}
            Method: ANY

Outputs:
  ApiBaseUrl:
    Description: Use this as apiBaseUrl for the storefront (the CHAOS_API_BASE_URL repository variable).
    Value: !Sub "https://${StoreApi}.execute-api.${AWS::Region}.amazonaws.com"
