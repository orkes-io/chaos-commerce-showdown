AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Chaos Commerce backend: one Lambda function behind an API Gateway HTTP API.
  It starts and reads Conductor workflows; it holds no state of its own.

Parameters:
  ConductorServerUrl:
    Type: String
    Description: Conductor API base URL reachable from Lambda, e.g. https://conductor.example.com/api (not localhost).
  ConductorUiUrl:
    Type: String
    Default: ""
    Description: Optional. Base URL of the Conductor UI for "view execution" links. Leave empty to hide the links.
  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: Origin allowed to call the API, e.g. https://your-user.github.io
  ConductorAuthKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional. Access key id for a secured (Orkes) Conductor.
  ConductorAuthSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional. Access key secret for a secured (Orkes) Conductor.

Resources:
  ChaosCommerceApi:
    Type: AWS::Serverless::Function
    Properties:
      Description: Chaos Commerce API (checkout and returns as Conductor workflows)
      CodeUri: .
      Handler: src/lambda.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      # API Gateway HTTP APIs give up after 30 s; stay just under it.
      Timeout: 29
      Environment:
        Variables:
          CONDUCTOR_SERVER_URL: !Ref ConductorServerUrl
          CONDUCTOR_UI_URL: !Ref ConductorUiUrl
          CONDUCTOR_AUTH_KEY: !Ref ConductorAuthKey
          CONDUCTOR_AUTH_SECRET: !Ref ConductorAuthSecret
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
      Events:
        # CORS (including OPTIONS preflight) is answered by the function itself, so no CorsConfiguration here.
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiBaseUrl:
    Description: Put this value in frontend/config.js (apiBaseUrl) or the CHAOS_API_BASE_URL repository variable.
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
