# Publishes frontend/ to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions", and add the repository variable
# CHAOS_API_BASE_URL (Settings -> Secrets and variables -> Actions -> Variables) with the Lambda API base URL.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the frontend at the backend
        env:
          CHAOS_API_BASE_URL: ${{ vars.CHAOS_API_BASE_URL }}
        run: |
          if [ -z "$CHAOS_API_BASE_URL" ]; then
            echo "::error::Set the CHAOS_API_BASE_URL repository variable to the backend URL (the ApiBaseUrl stack output)."
            exit 1
          fi
          node -e 'require("fs").writeFileSync("frontend/config.js", "window.CHAOS_CONFIG = " + JSON.stringify({ apiBaseUrl: process.env.CHAOS_API_BASE_URL.replace(/\/+$/, "") }, null, 2) + ";\n")'
          cat frontend/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
