#cloud-config
# core: the pipeline's Conductor (localhost only; reach the UI through an SSH
# tunnel) plus the Python workers, which `make sync` installs.
apt:
  conf: |
    Acquire::http::Timeout "30";
    Acquire::Retries "5";
package_update: true
packages:
  - git
  - curl
  - jq
  - unzip
  - rsync
  - python3
  - python3-venv
  - python3-pip
  - ca-certificates
  - docker.io

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  - mkdir -p /srv/chaos && chown ubuntu:ubuntu /srv/chaos
  - docker run -d --name conductor --restart unless-stopped -p 127.0.0.1:8080:8080 conductoross/conductor:${conductor_version}
  - bash -c 'for i in $(seq 1 120); do curl -sf http://localhost:8080/api/metadata/workflow >/dev/null && exit 0; sleep 5; done; exit 1'
  - touch /var/lib/chaos-ready
